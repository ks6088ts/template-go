name: ghcr
on:
  push:
    tags:
      - "v*"
env:
  IMAGE_NAME: template-go
permissions:
  contents: read
jobs:
  ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release-check
      - name: Check release source
        run: make format-check deps-check vet test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: type=semver,pattern={{version}}
          flavor: latest=auto
      - name: Validate image metadata
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: test -n "$IMAGE_VERSION"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_REVISION=${{ github.sha }}
            GIT_TAG=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
